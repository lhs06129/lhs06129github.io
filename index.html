<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>전화</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    -webkit-user-select: none;
    user-select: none;

    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

body {
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

    min-height: 100dvh;

    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);

    display: flex;
    flex-direction: column;
}


/* =========================
   번호 표시
========================= */

.display {
    height: 29dvh;

    display: flex;
    align-items: flex-end;
    justify-content: center;

    padding-bottom: 24px;
}

.phone-number {
    color: white;

    font-size: clamp(34px, 9vw, 40px);
    font-weight: 300;

    letter-spacing: 1px;

    min-height: 44px;

    white-space: nowrap;
}


/* =========================
   키패드
========================= */

.keypad {
    width: 100%;

    padding: 0 14.2%;

    display: flex;
    flex-direction: column;

    gap: 37px;
}

.row {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 14%;
}

.key {
    width: 100%;
    aspect-ratio: 1;

    border-radius: 50%;

    background: #1c1c1e;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    transition:
        background-color 0.08s,
        transform 0.08s;
}

.key:active {
    background: #5a5a5c;
    transform: scale(0.98);
}

.num {
    font-size: 42px;
    line-height: 42px;

    font-weight: 300;
}

.sub {
    font-size: 16px;
    line-height: 17px;

    font-weight: 600;

    letter-spacing: 3px;

    margin-top: 2px;
}


/* =========================
   통화 버튼
========================= */

.call-area {
    flex: 1;

    min-height: 110px;

    display: flex;

    justify-content: center;
    align-items: center;
}

.call {
    width: 84px;
    height: 84px;

    border-radius: 50%;

    background: #34c759;

    display: flex;

    justify-content: center;
    align-items: center;
}

.call:active {
    background: #248a3d;
}

.call svg {
    width: 38px;
    height: 38px;

    fill: white;
}


/* =========================
   하단 탭
========================= */

.bottom {
    width: 100%;

    padding:
        0
        4%
        max(12px, env(safe-area-inset-bottom));
}

.tabs {
    width: 100%;

    height: 86px;

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    align-items: center;
}

.tab {
    height: 82px;

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    gap: 4px;

    color: #f2f2f7;

    font-size: 13px;

    white-space: nowrap;
}

.icon {
    height: 43px;

    display: flex;

    align-items: center;
    justify-content: center;
}


/* 선택된 키패드 */

.tab.selected {
    color: #0a84ff;

    background: #29292b;

    border-radius: 42px;
}


/* =========================
   아이콘
========================= */

.star {
    font-size: 42px;
    line-height: 42px;
}

.clock {
    width: 36px;
    height: 36px;

    border:
        3px solid white;

    border-radius: 50%;

    position: relative;
}

.clock::before {
    content: "";

    position: absolute;

    width: 3px;
    height: 12px;

    background: white;

    left: 14px;
    top: 6px;

    border-radius: 2px;
}

.clock::after {
    content: "";

    position: absolute;

    width: 10px;
    height: 3px;

    background: white;

    left: 14px;
    top: 17px;

    transform:
        rotate(-30deg);

    transform-origin: left center;

    border-radius: 2px;
}


.contact {
    width: 38px;
    height: 38px;

    border-radius: 50%;

    background: white;

    position: relative;
}

.contact::before {
    content: "";

    position: absolute;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: #1c1c1e;

    top: 6px;
    left: 13px;
}

.contact::after {
    content: "";

    position: absolute;

    width: 25px;
    height: 13px;

    border-radius:
        14px 14px 8px 8px;

    background: #1c1c1e;

    left: 6px;
    bottom: 5px;
}


.grid-icon {
    display: grid;

    grid-template-columns:
        repeat(3, 7px);

    grid-template-rows:
        repeat(3, 7px);

    gap: 4px;
}

.grid-icon span {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #0a84ff;
}


.vm {
    display: flex;

    align-items: center;

    gap: 5px;
}

.vm span {
    width: 30px;
    height: 30px;

    border:
        3px solid white;

    border-radius: 50%;
}


/* =========================
   작은 화면
========================= */

@media (max-height: 750px) {

    .display {
        height: 25dvh;
    }

    .keypad {
        gap: 21px;
    }

    .call-area {
        min-height: 75px;
    }

    .call {
        width: 70px;
        height: 70px;
    }

    .call svg {
        width: 32px;
        height: 32px;
    }

    .tabs {
        height: 75px;
    }

    .tab {
        height: 72px;
    }
}

</style>
</head>


<body>


<!-- 번호 -->

<div class="display">

    <div
        class="phone-number"
        id="display">
    </div>

</div>



<!-- 키패드 -->

<div
    class="keypad"
    id="keypad">


    <div class="row">

        <div class="key">
            <span class="num">1</span>
        </div>

        <div class="key">
            <span class="num">2</span>
            <span class="sub">ABC</span>
        </div>

        <div class="key">
            <span class="num">3</span>
            <span class="sub">DEF</span>
        </div>

    </div>


    <div class="row">

        <div class="key">
            <span class="num">4</span>
            <span class="sub">GHI</span>
        </div>

        <div class="key">
            <span class="num">5</span>
            <span class="sub">JKL</span>
        </div>

        <div class="key">
            <span class="num">6</span>
            <span class="sub">MNO</span>
        </div>

    </div>


    <div class="row">

        <div class="key">
            <span class="num">7</span>
            <span class="sub">PQRS</span>
        </div>

        <div class="key">
            <span class="num">8</span>
            <span class="sub">TUV</span>
        </div>

        <div class="key">
            <span class="num">9</span>
            <span class="sub">WXYZ</span>
        </div>

    </div>


    <div class="row">

        <div class="key">
            <span class="num">*</span>
        </div>

        <div class="key">
            <span class="num">0</span>
            <span class="sub">+</span>
        </div>

        <div class="key">
            <span class="num">#</span>
        </div>

    </div>


</div>



<!-- 통화 -->

<div class="call-area">

    <div
        class="call"
        id="callBtn">

        <svg viewBox="0 0 24 24">

            <path d="
            M6.62 10.79
            a15.05 15.05 0 0 0
            6.59 6.59
            l2.2-2.2
            c.27-.27.67-.36
            1.02-.24
            1.12.37 2.33.57
            3.57.57
            .55 0 1 .45 1 1
            V20
            c0 .55-.45 1-1 1
            C10.61 21 3 13.39 3 4
            c0-.55.45-1 1-1
            h3.5
            c.55 0 1 .45 1 1
            0 1.25.2 2.45.57 3.57
            .11.35.03.74-.25 1.02
            l-2.2 2.2z"/>

        </svg>

    </div>

</div>



<!-- 하단 메뉴 -->

<div class="bottom">

    <div class="tabs">


        <div class="tab">

            <div class="icon star">
                ★
            </div>

            <span>
                즐겨찾기
            </span>

        </div>


        <div class="tab">

            <div class="icon">
                <div class="clock"></div>
            </div>

            <span>
                최근 통화
            </span>

        </div>


        <div class="tab">

            <div class="icon">
                <div class="contact"></div>
            </div>

            <span>
                연락처
            </span>

        </div>


        <div class="tab selected">

            <div class="icon">

                <div class="grid-icon">

                    <span></span>
                    <span></span>
                    <span></span>

                    <span></span>
                    <span></span>
                    <span></span>

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

            <span>
                키패드
            </span>

        </div>


        <div class="tab">

            <div class="icon vm">

                <span></span>
                <span></span>

            </div>

            <span>
                음성 사서함
            </span>

        </div>


    </div>

</div>



<script>


/* 실제 전화번호 */

const targetNumber =
    "01023610741";


let currentIndex = 0;


const display =
    document.getElementById(
        "display"
    );

const keypad =
    document.getElementById(
        "keypad"
    );

const callBtn =
    document.getElementById(
        "callBtn"
    );



/* 키패드 클릭 */

keypad.addEventListener(
    "click",
    () => {

        if (
            currentIndex <
            targetNumber.length
        ) {

            currentIndex++;

            updateDisplay();

        }

    }
);



/* 번호 표시 */

function updateDisplay() {

    let number =
        targetNumber.substring(
            0,
            currentIndex
        );


    if (
        number.length > 3 &&
        number.length <= 7
    ) {

        number =
            number.slice(0, 3)
            + "-"
            + number.slice(3);

    }

    else if (
        number.length > 7
    ) {

        number =
            number.slice(0, 3)
            + "-"
            + number.slice(3, 7)
            + "-"
            + number.slice(7);

    }


    display.textContent =
        number;

}



/* 전화 버튼 */

callBtn.addEventListener(
    "click",
    () => {

        if (
            currentIndex > 0
        ) {

            window.location.href =
                "tel:" + targetNumber;

        }

    }
);

</script>

</body>
</html>
</body>
</html>
