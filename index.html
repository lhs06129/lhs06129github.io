<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="전화">

<!-- 순정 iOS 전화 앱 아이콘 -->
<link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/Phone_iOS.png/512px-Phone_iOS.png">
<link rel="apple-touch-icon-precomposed" href="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/Phone_iOS.png/512px-Phone_iOS.png">

<title>전화</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color: white;
}

.app {
    width: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: #000;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
}

/* 상단 여백 및 숫자 표시 영역: 클릭 방지 설정 */
.display {
    flex: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 20px;
    min-height: 80px;
    pointer-events: none; 
}

.number {
    height: 48px;
    font-size: 36px;
    font-weight: 300;
    line-height: 48px;
    letter-spacing: 0.5px;
    white-space: nowrap;
    color: #fff;
}

.main-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 0 13%;
}

.keypad {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.row {
    width: 100%;
    display: flex;
    justify-content: space-between;
}

.key {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: #1c1c1e;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

/* 버튼 주위 여백으로도 부드럽게 눌리도록 가상의 확장 터치 영역 부여 */
.key::after {
    content: '';
    position: absolute;
    top: -8px;
    bottom: -8px;
    left: -8px;
    right: -8px;
    border-radius: 50%;
}

/* 숫자가 눌렸을 때 아이폰 스타일의 하얀색 전환 애니메이션 효과 */
.key:active, .key.active {
    background: #e5e5ea !important;
    color: #000000 !important;
    transform: scale(0.94);
    transition: background 0.05s ease, color 0.05s ease, transform 0.05s ease;
}

.num {
    font-size: 36px;
    font-weight: 300;
    line-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

.key[data-key="*"] .num {
    font-size: 40px;
    line-height: 1;
    transform: translateY(11px);
}

.key[data-key="#"] .num {
    font-size: 32px;
    line-height: 1;
    transform: translateY(4px);
}

.sub {
    margin-top: 2px;
    font-size: 10px;
    font-weight: 600;
    line-height: 10px;
    letter-spacing: 1.5px;
    height: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

.key[data-key="0"] .sub {
    font-size: 14px;
    font-weight: 400;
    margin-top: 0px;
    letter-spacing: 0;
}

/* 통화 영역 전체는 기본 클릭 방지 처리 (양옆 빈 공간 클릭 시 번호가 안 올라가게 함) */
.call-area {
    width: 100%;
    margin-top: 18px;
    margin-bottom: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    pointer-events: none; 
}

/* 초록색 통화 버튼 자체는 다시 클릭 가능하도록 허용 */
.call {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: #34c759;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
    z-index: 10;
    pointer-events: auto;
}

.call:active {
    background: #248a3d;
    transform: scale(0.92);
}

.call svg {
    width: 34px;
    height: 34px;
    pointer-events: none;
}

/* 지우기 버튼도 클릭 허용 */
.delete-btn {
    position: absolute;
    right: 10px;
    width: 50px;
    height: 50px;
    display: none;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    z-index: 10;
    opacity: 0.8;
    transition: opacity 0.1s ease;
    pointer-events: auto;
}

.delete-btn:active {
    opacity: 0.4;
}

.delete-btn svg {
    width: 36px;
    height: 36px;
    pointer-events: none;
}

.bottom {
    width: 100%;
    padding: 0 16px 12px 16px;
    z-index: 10;
}

.bottom-bar {
    width: 100%;
    height: 68px;
    border-radius: 34px;
    background: #1c1c1e;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 0 4px;
}

.tab {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
}

.tab-icon {
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

.tab-name {
    font-size: 11px;
    font-weight: 400;
    color: #8e8e93;
    pointer-events: none;
}

.tab.selected .tab-name {
    color: #2997ff;
}

.selected-bg {
    width: 58px;
    height: 34px;
    background: #2c2c2e;
    border-radius: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.dots-grid {
    display: grid;
    grid-template-columns: repeat(3, 6px);
    grid-gap: 3px;
}

.dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #2997ff;
}

@media (max-height: 700px) {
    .key, .call {
        width: 65px;
        height: 65px;
    }
    .num {
        font-size: 30px;
    }
    .keypad {
        gap: 12px;
    }
    .call-area {
        margin-top: 12px;
        margin-bottom: 16px;
    }
}
</style>
</head>
<body>

<div class="app" id="app">

    <div class="display">
        <div class="number" id="number"></div>
    </div>

    <div class="main-content">
        <div class="keypad" id="keypad">
            <div class="row">
                <div class="key" data-key="1"><div class="num">1</div><div class="sub"></div></div>
                <div class="key" data-key="2"><div class="num">2</div><div class="sub">ABC</div></div>
                <div class="key" data-key="3"><div class="num">3</div><div class="sub">DEF</div></div>
            </div>
            <div class="row">
                <div class="key" data-key="4"><div class="num">4</div><div class="sub">GHI</div></div>
                <div class="key" data-key="5"><div class="num">5</div><div class="sub">JKL</div></div>
                <div class="key" data-key="6"><div class="num">6</div><div class="sub">MNO</div></div>
            </div>
            <div class="row">
                <div class="key" data-key="7"><div class="num">7</div><div class="sub">PQRS</div></div>
                <div class="key" data-key="8"><div class="num">8</div><div class="sub">TUV</div></div>
                <div class="key" data-key="9"><div class="num">9</div><div class="sub">WXYZ</div></div>
            </div>
            <div class="row">
                <div class="key" data-key="*"><div class="num">*</div><div class="sub"></div></div>
                <div class="key" data-key="0"><div class="num">0</div><div class="sub">+</div></div>
                <div class="key" data-key="#"><div class="num">#</div><div class="sub"></div></div>
            </div>
        </div>

        <div class="call-area">
            <div class="call" id="call">
                <svg viewBox="0 0 24 24">
                    <path fill="white" d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C9.61 21 3 14.39 3 6c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.45 2.2z"/>
                </svg>
            </div>
            <div class="delete-btn" id="deleteBtn">
                <svg viewBox="0 0 32 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 2L2 12L10 22H28C29.1046 22 30 21.1046 30 20V4C30 2.89543 29.1046 2 28 2H10Z" fill="#3A3A3C"/>
                    <path d="M14 8L22 16M22 8L14 16" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
    </div>

    <div class="bottom">
        <div class="bottom-bar">
            <div class="tab">
                <div class="tab-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                </div>
                <div class="tab-name">즐겨찾기</div>
            </div>

            <div class="tab">
                <div class="tab-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </div>
                <div class="tab-name">최근 통화</div>
            </div>

            <div class="tab" id="contactsTab">
                <div class="tab-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <div class="tab-name">연락처</div>
            </div>

            <div class="tab selected">
                <div class="selected-bg">
                    <div class="dots-grid">
                        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                    </div>
                </div>
                <div class="tab-name">키패드</div>
            </div>

            <div class="tab">
                <div class="tab-icon">
                    <svg width="28" height="18" viewBox="0 0 28 18" fill="none" stroke="white" stroke-width="2">
                        <circle cx="6" cy="9" r="5"></circle>
                        <circle cx="22" cy="9" r="5"></circle>
                        <line x1="6" y1="14" x2="22" y2="14"></line>
                    </svg>
                </div>
                <div class="tab-name">음성 사서함</div>
            </div>
        </div>
    </div>

</div>

<script>
let targetNumber = "01012345678";
let index = 0;

const display = document.getElementById("number");
const call = document.getElementById("call");
const deleteBtn = document.getElementById("deleteBtn");
const contactsTab = document.getElementById("contactsTab");
const keys = document.querySelectorAll(".key");

let audioCtx = null;
let currentGainNode = null;
let currentOscillators = [];

function ensureAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

const dtmfFrequencies = {
    '1': [697, 1209], '2': [697, 1336], '3': [697, 1477],
    '4': [770, 1209], '5': [770, 1336], '6': [770, 1477],
    '7': [852, 1209], '8': [852, 1336], '9': [852, 1477],
    '*': [941, 1209], '0': [941, 1336], '#': [941, 1477]
};

function playSound(keyVal) {
    ensureAudioContext();
    stopSound();

    const freqs = dtmfFrequencies[keyVal];
    if (!freqs || !audioCtx) return;

    const now = audioCtx.currentTime;
    currentGainNode = audioCtx.createGain();

    currentGainNode.gain.setValueAtTime(0, now);
    currentGainNode.gain.linearRampToValueAtTime(0.08, now + 0.025);
    currentGainNode.connect(audioCtx.destination);

    currentOscillators = freqs.map(freq => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        osc.connect(currentGainNode);
        osc.start(now);
        return osc;
    });
}

function stopSound() {
    if (currentGainNode && audioCtx) {
        const now = audioCtx.currentTime;
        const fadeTime = 0.03;

        currentGainNode.gain.cancelScheduledValues(now);
        currentGainNode.gain.setValueAtTime(currentGainNode.gain.value, now);
        currentGainNode.gain.linearRampToValueAtTime(0, now + fadeTime);

        const oscsToStop = [...currentOscillators];
        setTimeout(() => {
            oscsToStop.forEach(osc => {
                try { osc.stop(); } catch(e) {}
            });
        }, fadeTime * 1000 + 10);

        currentOscillators = [];
        currentGainNode = null;
    }
}

function updateDisplay() {
    if (index === 0) {
        display.textContent = "";
        deleteBtn.style.display = "none";
    } else {
        deleteBtn.style.display = "flex";
        let value = targetNumber.substring(0, index);

        if (value.length > 3 && value.length <= 7) {
            value = value.substring(0, 3) + "-" + value.substring(3);
        } else if (value.length > 7) {
            value = value.substring(0, 3) + "-" + value.substring(3, 7) + "-" + value.substring(7);
        }

        display.textContent = value;
    }
}

// 각 키패드 개별 클릭 이벤트 적용 (숫자 주위 여백 터치 허용 + 애니메이션)
keys.forEach(key => {
    const keyVal = key.getAttribute("data-key");

    key.addEventListener("click", () => {
        let soundVal = keyVal;
        if (index < targetNumber.length) {
            soundVal = targetNumber[index];
        }
        playSound(soundVal);
        setTimeout(stopSound, 150);

        if (index < targetNumber.length) {
            index++;
            updateDisplay();
        }
    });
});

// 지우기 버튼
deleteBtn.addEventListener("click", () => {
    if (index > 0) {
        index--;
        updateDisplay();
    }
});

// 번호 변경 (연락처 탭)
contactsTab.addEventListener("click", () => {
    const input = prompt("마술용 전화번호를 입력하세요 (숫자만):", targetNumber);
    if (input !== null && input.trim() !== "") {
        targetNumber = input.replace(/[^0-9]/g, "");
        index = 0;
        updateDisplay();
        alert("전화번호가 " + targetNumber + " (으)로 변경되었습니다.");
    }
});

// 통화 버튼
call.addEventListener("click", () => {
    if (index > 0) {
        window.location.href = "tel:" + targetNumber;
    }
});
</script>

</body>
</html>
