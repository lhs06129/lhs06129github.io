<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>전화</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;

    color: white;
}

.app {
    width: 100%;
    height: 100dvh;

    display: flex;
    flex-direction: column;

    background: #000;

    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
}


/* =====================================
   번호 표시
===================================== */

.display {
    height: 30%;

    display: flex;
    align-items: flex-end;
    justify-content: center;

    padding-bottom: 25px;
}

.number {
    height: 48px;

    font-size: 37px;
    font-weight: 300;

    line-height: 48px;
    letter-spacing: 1px;

    white-space: nowrap;
}


/* =====================================
   키패드
===================================== */

.keypad {
    width: 100%;

    padding: 0 11.5%;

    display: flex;
    flex-direction: column;

    gap: 14px;
}

.row {
    width: 100%;

    display: grid;
    grid-template-columns: repeat(3, 1fr);

    column-gap: 18%;
}

.key {
    width: 100%;
    aspect-ratio: 1 / 1;

    border-radius: 50%;

    background: #1c1c1e;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;
}

.key:active {
    background: #555;
}

.num {
    font-size: 40px;
    font-weight: 300;

    line-height: 40px;
}

.sub {
    margin-top: 4px;

    font-size: 15px;
    font-weight: 600;

    line-height: 15px;

    letter-spacing: 3px;
}


/* =====================================
   통화 버튼
===================================== */

.call-area {
    flex: 1;

    min-height: 105px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.call {
    width: 70px;
    height: 70px;

    border-radius: 50%;

    background: #30d158;

    display: flex;
    justify-content: center;
    align-items: center;
}

.call:active {
    background: #248a3d;
}

.call svg {
    width: 35px;
    height: 35px;
}


/* =====================================
   하단 메뉴
===================================== */

.bottom {
    width: 100%;

    padding:
        0
        5.5%
        17px;
}

.bottom-bar {
    width: 100%;
    height: 100px;

    border-radius: 52px;

    background: #18181a;

    border: 1px solid #303034;

    display: grid;

    grid-template-columns:
        repeat(5, minmax(0, 1fr));

    align-items: center;
}


/* =====================================
   각각의 탭
===================================== */

.tab {
    min-width: 0;

    height: 100%;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 4px;

    white-space: nowrap;
}

.tab-name {
    font-size: 14px;
    font-weight: 500;

    line-height: 18px;

    white-space: nowrap;
}


/* =====================================
   즐겨찾기
===================================== */

.star {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 42px;
    line-height: 42px;
}


/* =====================================
   최근 통화
===================================== */

.recent {
    width: 40px;
    height: 40px;

    border: 3px solid white;

    border-radius: 50%;

    position: relative;
}

.recent::before {
    content: "";

    position: absolute;

    width: 3px;
    height: 13px;

    background: white;

    border-radius: 3px;

    left: 16px;
    top: 6px;
}

.recent::after {
    content: "";

    position: absolute;

    width: 11px;
    height: 3px;

    background: white;

    border-radius: 3px;

    left: 16px;
    top: 18px;

    transform: rotate(-35deg);

    transform-origin: left center;
}


/* =====================================
   연락처
===================================== */

.person {
    width: 40px;
    height: 40px;

    background: white;

    border-radius: 50%;

    position: relative;
}

.person::before {
    content: "";

    position: absolute;

    width: 12px;
    height: 12px;

    background: #18181a;

    border-radius: 50%;

    top: 6px;
    left: 14px;
}

.person::after {
    content: "";

    position: absolute;

    width: 25px;
    height: 13px;

    background: #18181a;

    border-radius: 15px 15px 9px 9px;

    bottom: 6px;
    left: 7px;
}


/* =====================================
   키패드 선택
===================================== */

.selected-area {
    width: 70px;
    height: 72px;

    border-radius: 38px;

    background: #303033;

    display: flex;

    align-items: center;
    justify-content: center;
}

.dots {
    display: grid;

    grid-template-columns:
        repeat(3, 8px);

    grid-template-rows:
        repeat(3, 8px);

    gap: 5px;
}

.dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #0a9cff;
}

.selected .tab-name {
    color: #0a9cff;
}


/* =====================================
   음성 사서함
===================================== */

.voicemail {
    display: flex;

    align-items: center;

    gap: 4px;
}

.vm {
    width: 36px;
    height: 36px;

    border: 3px solid white;

    border-radius: 50%;
}


/* =====================================
   작은 화면 보정
===================================== */

@media (max-height: 750px) {

    .display {
        height: 27%;
    }

    .keypad {
        gap: 10px;
    }

    .call-area {
        min-height: 85px;
    }

    .call {
        width: 62px;
        height: 62px;
    }

    .bottom-bar {
        height: 88px;
    }

    .tab-name {
        font-size: 12px;
    }
}

</style>
</head>


<body>

<div class="app">


    <!-- 번호 -->

    <div class="display">
        <div
            class="number"
            id="number">
        </div>
    </div>


    <!-- 키패드 -->

    <div
        class="keypad"
        id="keypad">


        <div class="row">

            <div class="key">
                <div class="num">1</div>
                <div class="sub"></div>
            </div>

            <div class="key">
                <div class="num">2</div>
                <div class="sub">ABC</div>
            </div>

            <div class="key">
                <div class="num">3</div>
                <div class="sub">DEF</div>
            </div>

        </div>


        <div class="row">

            <div class="key">
                <div class="num">4</div>
                <div class="sub">GHI</div>
            </div>

            <div class="key">
                <div class="num">5</div>
                <div class="sub">JKL</div>
            </div>

            <div class="key">
                <div class="num">6</div>
                <div class="sub">MNO</div>
            </div>

        </div>


        <div class="row">

            <div class="key">
                <div class="num">7</div>
                <div class="sub">PQRS</div>
            </div>

            <div class="key">
                <div class="num">8</div>
                <div class="sub">TUV</div>
            </div>

            <div class="key">
                <div class="num">9</div>
                <div class="sub">WXYZ</div>
            </div>

        </div>


        <div class="row">

            <div class="key">
                <div class="num">*</div>
                <div class="sub"></div>
            </div>

            <div class="key">
                <div class="num">0</div>
                <div class="sub">+</div>
            </div>

            <div class="key">
                <div class="num">#</div>
                <div class="sub"></div>
            </div>

        </div>

    </div>


    <!-- 통화 -->

    <div class="call-area">

        <div
            class="call"
            id="call">

            <svg viewBox="0 0 24 24">

                <path
                    fill="white"
                    d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C9.61 21 3 14.39 3 6c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.45 2.2z"/>

            </svg>

        </div>

    </div>


    <!-- 하단 메뉴 -->

    <div class="bottom">

        <div class="bottom-bar">


            <div class="tab">

                <div class="star">★</div>

                <div class="tab-name">
                    즐겨찾기
                </div>

            </div>


            <div class="tab">

                <div class="recent"></div>

                <div class="tab-name">
                    최근 통화
                </div>

            </div>


            <div class="tab">

                <div class="person"></div>

                <div class="tab-name">
                    연락처
                </div>

            </div>


            <div class="tab selected">

                <div class="selected-area">

                    <div class="dots">

                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>

                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>

                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>

                    </div>

                </div>

                <div class="tab-name">
                    키패드
                </div>

            </div>


            <div class="tab">

                <div class="voicemail">

                    <div class="vm"></div>
                    <div class="vm"></div>

                </div>

                <div class="tab-name">
                    음성 사서함
                </div>

            </div>


        </div>

    </div>

</div>


<script>

const targetNumber = "01012345678";

let index = 0;

const display =
    document.getElementById("number");

const keypad =
    document.getElementById("keypad");

const call =
    document.getElementById("call");


keypad.addEventListener("click", () => {

    if (index < targetNumber.length) {

        index++;

        let value =
            targetNumber.substring(0, index);

        if (
            value.length > 3 &&
            value.length <= 7
        ) {

            value =
                value.substring(0, 3)
                + "-"
                + value.substring(3);

        }

        else if (value.length > 7) {

            value =
                value.substring(0, 3)
                + "-"
                + value.substring(3, 7)
                + "-"
                + value.substring(7);

        }

        display.textContent = value;
    }

});


call.addEventListener("click", () => {

    if (index > 0) {

        window.location.href =
            "tel:" + targetNumber;

    }

});

</script>

</body>
</html>
