<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>전화</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html,
body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

body {
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
}


/* =========================================
   전체 화면
========================================= */

.phone-app {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    background: #000;
}


/* =========================================
   번호 표시 영역
========================================= */

.number-area {
    height: 27%;

    display: flex;
    justify-content: center;
    align-items: flex-end;

    padding-bottom: 24px;
}

.number {
    min-height: 45px;

    font-size: 38px;
    font-weight: 300;

    letter-spacing: 1px;
    line-height: 45px;

    text-align: center;
}


/* =========================================
   키패드
========================================= */

.keypad {
    width: 100%;

    padding: 0 14.2%;

    display: flex;
    flex-direction: column;

    gap: 14px;
}

.row {
    width: 100%;

    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: 14.5%;
}


/* 개별 버튼 */

.key {
    width: 100%;
    aspect-ratio: 1;

    border-radius: 50%;

    background: #1c1c1e;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    transition: background .08s;
}

.key:active {
    background: #5a5a5c;
}


/* 숫자 */

.num {
    font-size: 43px;
    font-weight: 300;

    line-height: 43px;
}


/* 영문 */

.sub {
    margin-top: 4px;

    font-size: 16px;
    font-weight: 600;

    line-height: 16px;

    letter-spacing: 3px;
}


/* =========================================
   통화 버튼
========================================= */

.call-area {
    flex: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 115px;
}

.call-button {
    width: 166px;
    height: 166px;

    max-width: 22vw;
    max-height: 22vw;

    border-radius: 50%;

    background: #30d158;

    display: flex;
    justify-content: center;
    align-items: center;
}

.call-button:active {
    background: #248a3d;
}

.call-button svg {
    width: 61px;
    height: 61px;
}


/* =========================================
   하단 탭 바
========================================= */

.bottom {
    width: 100%;

    padding:
        0
        5.5%
        17px;
}

.bottom-bar {
    width: 100%;
    height: 116px;

    background: #18181a;

    border: 1px solid #303034;

    border-radius: 60px;

    display: grid;
    grid-template-columns: repeat(5, 1fr);

    align-items: center;
}


/* =========================================
   탭
========================================= */

.tab {
    height: 100%;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    gap: 5px;

    color: #fff;
}

.tab-name {
    font-size: 16px;
    line-height: 20px;
    font-weight: 500;

    white-space: nowrap;
}


/* =========================================
   즐겨찾기
========================================= */

.star {
    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 48px;
    line-height: 48px;
}


/* =========================================
   최근 통화
========================================= */

.recent-icon {
    width: 43px;
    height: 43px;

    border: 4px solid #fff;

    border-radius: 50%;

    position: relative;
}

.recent-icon::before {
    content: "";

    position: absolute;

    width: 4px;
    height: 15px;

    background: #fff;

    border-radius: 3px;

    left: 17px;
    top: 6px;
}

.recent-icon::after {
    content: "";

    position: absolute;

    width: 13px;
    height: 4px;

    background: #fff;

    border-radius: 3px;

    left: 17px;
    top: 20px;

    transform: rotate(-35deg);

    transform-origin: left center;
}


/* =========================================
   연락처
========================================= */

.person-icon {
    width: 43px;
    height: 43px;

    background: #fff;

    border-radius: 50%;

    position: relative;
}

.person-icon::before {
    content: "";

    position: absolute;

    width: 13px;
    height: 13px;

    background: #18181a;

    border-radius: 50%;

    top: 7px;
    left: 15px;
}

.person-icon::after {
    content: "";

    position: absolute;

    width: 27px;
    height: 14px;

    background: #18181a;

    border-radius: 15px 15px 10px 10px;

    bottom: 6px;
    left: 8px;
}


/* =========================================
   키패드 아이콘
========================================= */

.keypad-tab {
    width: 90px;
    height: 84px;

    border-radius: 45px;

    background: #303033;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: -1px;
}

.dots {
    display: grid;

    grid-template-columns: repeat(3, 9px);
    grid-template-rows: repeat(3, 9px);

    gap: 6px;
}

.dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #0a9cff;
}


/* 선택된 키패드 글자 */

.selected .tab-name {
    color: #0a9cff;
}


/* =========================================
   음성 사서함
========================================= */

.voicemail {
    display: flex;
    align-items: center;

    gap: 5px;
}

.vm {
    width: 40px;
    height: 40px;

    border: 4px solid #fff;

    border-radius: 50%;
}


/* =========================================
   화면이 작은 아이폰
========================================= */

@media (max-height: 750px) {

    .number-area {
        height: 22%;
    }

    .keypad {
        gap: 10px;
    }

    .call-area {
        min-height: 80px;
    }

    .call-button {
        width: 125px;
        height: 125px;
    }

    .call-button svg {
        width: 48px;
        height: 48px;
    }

    .bottom-bar {
        height: 90px;
    }

    .tab-name {
        font-size: 14px;
    }
}

</style>
</head>


<body>

<div class="phone-app">


    <!-- =================================
         번호
    ================================== -->

    <div class="number-area">

        <div
            class="number"
            id="number">
        </div>

    </div>



    <!-- =================================
         키패드
    ================================== -->

    <div
        class="keypad"
        id="keypad">


        <div class="row">

            <div class="key">
                <div class="num">1</div>
                <div class="sub"></div>
            </div>

            <div class="key">
                <div class="num">2</div>
                <div class="sub">ABC</div>
            </div>

            <div class="key">
                <div class="num">3</div>
                <div class="sub">DEF</div>
            </div>

        </div>


        <div class="row">

            <div class="key">
                <div class="num">4</div>
                <div class="sub">GHI</div>
            </div>

            <div class="key">
                <div class="num">5</div>
                <div class="sub">JKL</div>
            </div>

            <div class="key">
                <div class="num">6</div>
                <div class="sub">MNO</div>
            </div>

        </div>


        <div class="row">

            <div class="key">
                <div class="num">7</div>
                <div class="sub">PQRS</div>
            </div>

            <div class="key">
                <div class="num">8</div>
                <div class="sub">TUV</div>
            </div>

            <div class="key">
                <div class="num">9</div>
                <div class="sub">WXYZ</div>
            </div>

        </div>


        <div class="row">

            <div class="key">
                <div class="num">*</div>
                <div class="sub"></div>
            </div>

            <div class="key">
                <div class="num">0</div>
                <div class="sub">+</div>
            </div>

            <div class="key">
                <div class="num">#</div>
                <div class="sub"></div>
            </div>

        </div>

    </div>



    <!-- =================================
         통화
    ================================== -->

    <div class="call-area">

        <div
            class="call-button"
            id="call">

            <svg viewBox="0 0 24 24">

                <path
                    fill="white"
                    d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24
                    1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1
                    C9.61 21 3 14.39 3 6c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1
                    0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.45 2.2z"/>

            </svg>

        </div>

    </div>



    <!-- =================================
         하단 메뉴
    ================================== -->

    <div class="bottom">

        <div class="bottom-bar">


            <!-- 즐겨찾기 -->

            <div class="tab">

                <div class="star">★</div>

                <div class="tab-name">
                    즐겨찾기
                </div>

            </div>


            <!-- 최근 통화 -->

            <div class="tab">

                <div class="recent-icon"></div>

                <div class="tab-name">
                    최근 통화
                </div>

            </div>


            <!-- 연락처 -->

            <div class="tab">

                <div class="person-icon"></div>

                <div class="tab-name">
                    연락처
                </div>

            </div>


            <!-- 키패드 -->

            <div class="tab selected">

                <div class="keypad-tab">

                    <div class="dots">

                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>

                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>

                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>

                    </div>

                </div>

                <div class="tab-name">
                    키패드
                </div>

            </div>


            <!-- 음성 사서함 -->

            <div class="tab">

                <div class="voicemail">

                    <div class="vm"></div>
                    <div class="vm"></div>

                </div>

                <div class="tab-name">
                    음성 사서함
                </div>

            </div>


        </div>

    </div>

</div>



<script>

/* 원하는 번호 */
const targetNumber = "01012345678";

let index = 0;

const display =
    document.getElementById("number");

const keypad =
    document.getElementById("keypad");

const call =
    document.getElementById("call");


/* 키패드를 누르면 번호가 한 자리씩 나타남 */

keypad.addEventListener(
    "click",
    () => {

        if (index < targetNumber.length) {

            index++;

            let value =
                targetNumber.substring(
                    0,
                    index
                );


            if (value.length > 3 &&
                value.length <= 7) {

                value =
                    value.substring(0, 3)
                    + "-"
                    + value.substring(3);

            }

            else if (value.length > 7) {

                value =
                    value.substring(0, 3)
                    + "-"
                    + value.substring(3, 7)
                    + "-"
                    + value.substring(7);

            }


            display.textContent = value;

        }

    }
);


/* 전화 버튼 */

call.addEventListener(
    "click",
    () => {

        if (index > 0) {

            window.location.href =
                "tel:" + targetNumber;

        }

    }
);

</script>

</body>
</html>
