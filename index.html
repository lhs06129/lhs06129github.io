<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>전화</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none; /* 가장자리 터치 제스처로 인한 파열음 완전 차단 */
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color: white;
}

.app {
    width: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: #000;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
}

.display {
    flex: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 20px;
    min-height: 80px;
}

.number {
    height: 48px;
    font-size: 36px;
    font-weight: 300;
    line-height: 48px;
    letter-spacing: 0.5px;
    white-space: nowrap;
    color: #fff;
}

.main-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 0 13%;
}

.keypad {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.row {
    width: 100%;
    display: flex;
    justify-content: space-between;
}

.key {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: #1c1c1e;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    position: relative;
    transition: background 0.2s ease-out, color 0.2s ease-out, transform 0.1s ease-out;
}

.key.active {
    background: #e5e5ea;
    color: #000000;
    transform: scale(0.96);
    transition: none;
}

.num {
    font-size: 36px;
    font-weight: 300;
    line-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none; /* 내부 글자 터치 간섭 방지 */
}

.key[data-key="*"] .num {
    font-size: 40px;
    line-height: 1;
    transform: translateY(11px);
}

.key[data-key="#"] .num {
    font-size: 32px;
    line-height: 1;
    transform: translateY(4px);
}

.sub {
    margin-top: 2px;
    font-size: 10px;
    font-weight: 600;
    line-height: 10px;
    letter-spacing: 1.5px;
    height: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none; /* 내부 글자 터치 간섭 방지 */
}

.key[data-key="0"] .sub {
    font-size: 14px;
    font-weight: 400;
    margin-top: 0px;
    letter-spacing: 0;
}

.call-area {
    margin-top: 18px;
    margin-bottom: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.call {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: #34c759;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
}

.call.active {
    background: #248a3d;
    transform: scale(0.92);
}

.call svg {
    width: 34px;
    height: 34px;
    pointer-events: none;
}

.bottom {
    width: 100%;
    padding: 0 16px 12px 16px;
}

.bottom-bar {
    width: 100%;
    height: 68px;
    border-radius: 34px;
    background: #1c1c1e;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 0 4px;
}

.tab {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
}

.tab-icon {
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

.tab-name {
    font-size: 11px;
    font-weight: 400;
    color: #8e8e93;
    pointer-events: none;
}

.tab.selected .tab-name {
    color: #2997ff;
}

.selected-bg {
    width: 58px;
    height: 34px;
    background: #2c2c2e;
    border-radius: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.dots-grid {
    display: grid;
    grid-template-columns: repeat(3, 6px);
    grid-gap: 3px;
}

.dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #2997ff;
}

@media (max-height: 700px) {
    .key, .call {
        width: 65px;
        height: 65px;
    }
    .num {
        font-size: 30px;
    }
    .keypad {
        gap: 12px;
    }
    .call-area {
        margin-top: 12px;
        margin-bottom: 16px;
    }
}
</style>
</head>
<body>

<div class="app">

    <div class="display">
        <div class="number" id="number"></div>
    </div>

    <div class="main-content">
        <div class="keypad" id="keypad">
            <div class="row">
                <div class="key" data-key="1"><div class="num">1</div><div class="sub"></div></div>
                <div class="key" data-key="2"><div class="num">2</div><div class="sub">ABC</div></div>
                <div class="key" data-key="3"><div class="num">3</div><div class="sub">DEF</div></div>
            </div>
            <div class="row">
                <div class="key" data-key="4"><div class="num">4</div><div class="sub">GHI</div></div>
                <div class="key" data-key="5"><div class="num">5</div><div class="sub">JKL</div></div>
                <div class="key" data-key="6"><div class="num">6</div><div class="sub">MNO</div></div>
            </div>
            <div class="row">
                <div class="key" data-key="7"><div class="num">7</div><div class="sub">PQRS</div></div>
                <div class="key" data-key="8"><div class="num">8</div><div class="sub">TUV</div></div>
                <div class="key" data-key="9"><div class="num">9</div><div class="sub">WXYZ</div></div>
            </div>
            <div class="row">
                <div class="key" data-key="*"><div class="num">*</div><div class="sub"></div></div>
                <div class="key" data-key="0"><div class="num">0</div><div class="sub">+</div></div>
                <div class="key" data-key="#"><div class="num">#</div><div class="sub"></div></div>
            </div>
        </div>

        <div class="call-area">
            <div class="call" id="call">
                <svg viewBox="0 0 24 24">
                    <path fill="white" d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C9.61 21 3 14.39 3 6c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.45 2.2z"/>
                </svg>
            </div>
        </div>
    </div>

    <div class="bottom">
        <div class="bottom-bar">
            <div class="tab">
                <div class="tab-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                </div>
                <div class="tab-name">즐겨찾기</div>
            </div>

            <div class="tab">
                <div class="tab-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </div>
                <div class="tab-name">최근 통화</div>
            </div>

            <div class="tab" id="contactsTab">
                <div class="tab-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <div class="tab-name">연락처</div>
            </div>

            <div class="tab selected">
                <div class="selected-bg">
                    <div class="dots-grid">
                        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                    </div>
                </div>
                <div class="tab-name">키패드</div>
            </div>

            <div class="tab">
                <div class="tab-icon">
                    <svg width="28" height="18" viewBox="0 0 28 18" fill="none" stroke="white" stroke-width="2">
                        <circle cx="6" cy="9" r="5"></circle>
                        <circle cx="22" cy="9" r="5"></circle>
                        <line x1="6" y1="14" x2="22" y2="14"></line>
                    </svg>
                </div>
                <div class="tab-name">음성 사서함</div>
            </div>
        </div>
    </div>

</div>

<script>
let targetNumber = "01023610741";
let index = 0;

const display = document.getElementById("number");
const keys = document.querySelectorAll(".key");
const call = document.getElementById("call");
const contactsTab = document.getElementById("contactsTab");

const silentAudio = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=");
silentAudio.volume = 0;

const dtmfSounds = {
    '1': new Audio("https://www.soundjay.com/phone/phone-calling-1.mp3"),
    '2': new Audio("https://www.soundjay.com/phone/phone-calling-2.mp3"),
    '3': new Audio("https://www.soundjay.com/phone/phone-calling-3.mp3"),
    '4': new Audio("https://www.soundjay.com/phone/phone-calling-4.mp3"),
    '5': new Audio("https://www.soundjay.com/phone/phone-calling-5.mp3"),
    '6': new Audio("https://www.soundjay.com/phone/phone-calling-6.mp3"),
    '7': new Audio("https://www.soundjay.com/phone/phone-calling-7.mp3"),
    '8': new Audio("https://www.soundjay.com/phone/phone-calling-8.mp3"),
    '9': new Audio("https://www.soundjay.com/phone/phone-calling-9.mp3"),
    '0': new Audio("https://www.soundjay.com/phone/phone-calling-0.mp3"),
    '*': new Audio("https://www.soundjay.com/phone/phone-calling-star.mp3"),
    '#': new Audio("https://www.soundjay.com/phone/phone-calling-hash.mp3")
};

Object.values(dtmfSounds).forEach(audio => {
    audio.preload = "auto";
});

let isAudioWarmedUp = false;

function warmUpAudio() {
    if (isAudioWarmedUp) return;
    silentAudio.play().then(() => {
        isAudioWarmedUp = true;
    }).catch(() => {});
}

// 화면 아무 곳이나 터치 시 무음 깨우기 실행
window.addEventListener('pointerdown', warmUpAudio, { once: true, capture: true });

let currentAudio = null;

function playSound(keyVal) {
    warmUpAudio();

    if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
    }

    const sound = dtmfSounds[keyVal];
    if (sound) {
        currentAudio = sound;
        currentAudio.currentTime = 0;
        currentAudio.volume = 0.5;
        currentAudio.play().catch(() => {});
    }
}

function stopSound() {
    if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
    }
}

/* 터치 제어: 모바일 이중 터치 및 가장자리 이탈로 인한 파열음 제어 */
keys.forEach(key => {
    const keyVal = key.getAttribute("data-key");
    let isTouched = false;

    const pressStart = (e) => {
        e.preventDefault();
        isTouched = true;
        key.classList.add("active");
        playSound(keyVal);
    };

    const pressEnd = (e) => {
        e.preventDefault();
        if (isTouched) {
            isTouched = false;
            key.classList.remove("active");
            stopSound();
            handleKeyPress();
        }
    };

    const pressCancel = (e) => {
        if (isTouched) {
            isTouched = false;
            key.classList.remove("active");
            stopSound();
        }
    };

    key.addEventListener("touchstart", pressStart, { passive: false });
    key.addEventListener("touchend", pressEnd, { passive: false });
    key.addEventListener("touchcancel", pressCancel, { passive: false });

    // PC 전용 마우스 처리 (터치 미지원 환경)
    key.addEventListener("mousedown", (e) => {
        if (e.pointerType === 'mouse' || !('ontouchstart' in window)) {
            pressStart(e);
        }
    });
    key.addEventListener("mouseup", (e) => {
        if (e.pointerType === 'mouse' || !('ontouchstart' in window)) {
            pressEnd(e);
        }
    });
    key.addEventListener("mouseleave", pressCancel);
});

function handleKeyPress() {
    if (index < targetNumber.length) {
        index++;
        let value = targetNumber.substring(0, index);

        if (value.length > 3 && value.length <= 7) {
            value = value.substring(0, 3) + "-" + value.substring(3);
        } else if (value.length > 7) {
            value = value.substring(0, 3) + "-" + value.substring(3, 7) + "-" + value.substring(7);
        }

        display.textContent = value;
    }
}

contactsTab.addEventListener("click", () => {
    const input = prompt("마술용 전화번호를 입력하세요 (숫자만):", targetNumber);
    if (input !== null && input.trim() !== "") {
        targetNumber = input.replace(/[^0-9]/g, "");
        index = 0;
        display.textContent = "";
        alert("전화번호가 " + targetNumber + " (으)로 변경되었습니다.");
    }
});

call.addEventListener("touchstart", (e) => { e.preventDefault(); call.classList.add("active"); });
call.addEventListener("touchend", (e) => {
    e.preventDefault();
    call.classList.remove("active");
    if (index > 0) {
        window.location.href = "tel:" + targetNumber;
    }
});
call.addEventListener("mousedown", () => call.classList.add("active"));
call.addEventListener("mouseup", () => {
    call.classList.remove("active");
    if (index > 0) {
        window.location.href = "tel:" + targetNumber;
    }
});
</script>

</body>
</html>
